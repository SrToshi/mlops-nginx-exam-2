networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  api-v1:
    build:
      context: .
      dockerfile: src/api/v1/Dockerfile
    deploy:
      replicas: 3

  api-v2:
    build:
      context: .
      dockerfile: src/api/v2/Dockerfile
    
  nginx:
    # # config of Ngingx service
    build:
      context: .
      dockerfile: deployments/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-v1
      - api-v2
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    environment:
      SCRAPE_URI: https://nginx/nginx_status
      SSL_VERIFY: "false" # self-signed cert, not a security downgrade (still HTTPS end-to-end)

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx_exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  prometheus_data:
  grafana_data: